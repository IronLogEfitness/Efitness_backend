# CI/CD pipeline: every push to main first runs the test suite; only if it passes
# does it build the Docker image, push it to Azure Container Registry, and let the
# ACR webhook make App Service redeploy.

name: Build and deploy to Azure

# WHEN to run: on every push to the main branch.
# workflow_dispatch adds a manual "Run workflow" button in the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Lint + type-check gate: ruff and mypy must pass before anything else. ──
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (runtime + dev)
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check app

      - name: Mypy (type-check)
        run: mypy app

  # ── CI gate: run the test suite (pure logic + DB-backed via mongomock + the
  #    API-level flows). No real DB or Gemini key needed. ──
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # requirements-dev.txt pulls in runtime deps (-r requirements.txt) plus pytest.
      - name: Install dependencies (runtime + test)
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  build-and-push:
    # Don't build/deploy unless both the lint/type-check and the tests passed.
    needs: [lint, test]
    # The runner: a fresh Linux VM GitHub spins up for this run (Docker preinstalled).
    runs-on: ubuntu-latest

    steps:
      # 1. Download the repo's code onto the runner (a fresh VM has nothing on it).
      - name: Check out the code
        uses: actions/checkout@v4

      # 2. docker login to the private registry. The password comes from the
      #    encrypted repo secret — never written in this file, masked in logs.
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: efitness2530307.azurecr.io
          username: efitness2530307
          password: ${{ secrets.ACR_PASSWORD }}

      # 3. Build the image from the Dockerfile at the repo root — exactly the
      #    `docker build` you ran locally, now on GitHub's machine.
      - name: Build the image
        run: docker build -t efitness2530307.azurecr.io/efitness-backend:latest .

      # 4. Push to ACR. This overwrites :latest, which fires the ACR webhook,
      #    which tells App Service to pull the new image and restart (the CD half).
      - name: Push the image to ACR
        run: docker push efitness2530307.azurecr.io/efitness-backend:latest
